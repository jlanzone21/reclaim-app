// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Distributes debug builds to testers (Joey/Nathaniel) via Firebase App Distribution --
        // see app/build.gradle's firebaseAppDistribution block and PURPOSE.md for the one-time
        // `firebase login` each person needs locally before `./gradlew appDistributionUploadDebug` works.
        classpath 'com.google.firebase:firebase-appdistribution-gradle:5.3.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
